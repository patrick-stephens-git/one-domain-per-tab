<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Domain Per Tab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 300px;
      background: #f9fafb;
      color: #111827;
    }

    header {
      background: #dc2626;
      color: white;
      padding: 14px 16px;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    header p {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 2px;
    }

    #section-label {
      padding: 10px 16px 4px;
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    #site-list {
      list-style: none;
      max-height: 260px;
      overflow-y: auto;
    }

    #site-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid #e5e7eb;
      background: white;
      font-size: 13px;
    }

    #site-list li:last-child {
      border-bottom: none;
    }

    #site-list li span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      font-size: 16px;
      padding: 0 0 0 8px;
      line-height: 1;
      flex-shrink: 0;
    }

    .remove-btn:hover {
      color: #dc2626;
    }

    #empty-state {
      padding: 24px 16px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      background: white;
    }

    #add-form {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
      background: #f9fafb;
    }

    #site-input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background: white;
    }

    #site-input:focus {
      border-color: #dc2626;
    }

    #add-btn {
      padding: 8px 14px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      flex-shrink: 0;
    }

    #add-btn:hover {
      background: #b91c1c;
    }

    #error-msg {
      padding: 6px 16px;
      font-size: 11px;
      color: #dc2626;
      background: #fef2f2;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>One Domain Per Tab</h1>
    <p>Blocks new tabs on a domain that's already open</p>
  </header>

  <div id="section-label">Override list (exempt domains)</div>

  <ul id="site-list"></ul>
  <div id="empty-state" style="display:none">No overrides yet — the rule applies to all domains.</div>

  <div id="error-msg"></div>

  <form id="add-form">
    <input
      id="site-input"
      type="text"
      placeholder="e.g. mail.google.com"
      autocomplete="off"
      spellcheck="false"
    />
    <button id="add-btn" type="submit">Add</button>
  </form>

  <script src="popup.js"></script>
</body>
</html>
